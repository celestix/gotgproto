name: Go

on:
  push:
    branches: [ beta ]
  pull_request:
    branches: [ beta ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Tidy dependencies
        run: go mod tidy

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: binary
          args: --timeout 30m

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [ amd64, 386 ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Tidy dependencies
        run: go mod tidy

      - name: Build
        env:
          GOARCH: ${{ matrix.arch }}
        run: go build -v ./...

      - name: Test
        env:
          GOARCH: ${{ matrix.arch }}
        run: go test -v ./...