name: Go

on:
  push:
    branches: [ beta ]
  pull_request:
    branches: [ beta ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.23.3

      - name: Get Go environment
        id: go-env
        run: |
          echo "cache=$(go env GOCACHE)" >> $GITHUB_OUTPUT
          echo "modcache=$(go env GOMODCACHE)" >> $GITHUB_OUTPUT
          echo "lintcache=$HOME/.cache/golangci-lint" >> $GITHUB_OUTPUT
      - name: Set up cache
        uses: actions/cache@v3
        with:
          path: |
            ${{ steps.go-env.outputs.cache }}
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.lintcache }}
          key: lint-${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-${{ hashFiles('**/go.mod') }}-${{ hashFiles('generic/*.go') }}
          restore-keys: |
            lint-${{ runner.os }}-go-
      - name: Lint
        uses: golangci/golangci-lint-action@v6.1.1
        with:
          version: latest
          args: --timeout 30m


  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, 386]
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.23.3

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
