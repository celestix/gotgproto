version: "2"

run:
  # Timeout for the total linting execution.
  timeout: 10m
  # Include test files in the static analysis.
  tests: true

linters:
  # Disable default linters and selectively enable high-signal ones.
  default: none
  enable:
    - errcheck     # Checks for unchecked errors in Go code.
    - govet        # Reports suspicious constructs and potential bugs.
    - ineffassign  # Detects unused variable assignments.
    - staticcheck  # Powerful linter (now integrates gosimple and stylecheck internally).
    - unused       # Detects unused variables, constants, functions, etc.
    - copyloopvar  # Prevents loop variable reference bugs in concurrent processing (Go 1.22+).

  # Migration to v2: All linter configurations must reside under linters.settings
  settings:
    staticcheck:
      checks:
        - "all"
        - "-ST*"  # Disable all subjective style and naming checks (e.g. ST1003, ST1016, ST1000) to keep public API compatible.
        - "-QF*"  # Disable all quickfix styling recommendations (e.g. QF1001, QF1008) to eliminate style noise.

  # Migration to v2: Directory exclusions have migrated from issues.exclude-dirs to linters.exclusions.paths
  exclusions:
    paths:
      - "examples/.*"